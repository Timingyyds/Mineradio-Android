// ═══════════════════════════════════════════════
//  Mineradio Assets 加密任务
//  将 src/main/mineradio_src/ 中的明文文件用 AES-CBC 加密后
//  输出到 build/generated/assets/mineradio/，打包进 APK
// ═══════════════════════════════════════════════

// 密钥 passphrase（与 AssetDecryptor.kt 中的 KEY_PASSPHRASE 一致）
// "Sp1ca@Minerad1o#2024$SecureAssetKey!" 的 ASCII 字节数组
def MINERADIO_KEY_PASSPHRASE_BYTES = [
    83, 112, 49, 99, 97, 64, 77, 105, 110, 101, 114, 97, 100, 49, 111, 35,
    50, 48, 50, 52, 36, 83, 101, 99, 117, 114, 101, 65, 115, 115, 101, 116,
    75, 101, 121, 33
] as byte[]

def mineradioSrcDir = file("src/main/mineradio_src")
def mineradioEncDir = file("${buildDir}/generated/assets/mineradio")

task encryptMineradioAssets {
    description = 'Encrypts mineradio_src assets into build/generated/assets/mineradio (AES-CBC)'
    group = 'build'
    inputs.dir mineradioSrcDir
    outputs.dir mineradioEncDir

    doLast {
        if (!mineradioSrcDir.exists()) {
            logger.warn("encryptMineradioAssets: src/main/mineradio_src not found, skipping")
            return
        }

        // 清理旧输出（处理源文件删除的情况）
        if (mineradioEncDir.exists()) {
            mineradioEncDir.deleteDir()
        }
        mineradioEncDir.mkdirs()

        // 派生 256 位 AES 密钥
        def keyBytes = MessageDigest.getInstance('SHA-256').digest(MINERADIO_KEY_PASSPHRASE_BYTES)
        def random = new SecureRandom()
        def magic = [77, 69, 78, 67] as byte[]  // "MENC"

        def srcBase = mineradioSrcDir.canonicalPath
        int count = 0

        mineradioSrcDir.eachFileRecurse { srcFile ->
            if (!srcFile.isFile()) return

            def relPath = srcFile.canonicalPath.substring(srcBase.length() + 1)
            relPath = relPath.replace('\\', '/')
            def outFile = new File(mineradioEncDir, relPath)
            outFile.parentFile.mkdirs()

            def plainBytes = srcFile.bytes
            def iv = new byte[16]
            random.nextBytes(iv)

            def cipher = Cipher.getInstance('AES/CBC/PKCS5Padding')
            cipher.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(keyBytes, 'AES'), new IvParameterSpec(iv))
            def encBytes = cipher.doFinal(plainBytes)

            outFile.withOutputStream { out ->
                out.write(magic)    // 4 字节魔数
                out.write(iv)       // 16 字节 IV
                out.write(encBytes) // 密文
            }
            count++
        }

        logger.lifecycle("encryptMineradioAssets: ${count} files encrypted → ${mineradioEncDir}")
    }
}

// 确保构建前完成加密
tasks.getByPath(':app:preBuild').dependsOn('encryptMineradioAssets')

// ═══════════════════════════════════════════════
//  NodeJS Project 准备任务
//  将 src/main/nodejs-project-src/ 复制到 build/generated/assets/nodejs-project/
//  对重要业务文件用 AES-CBC 加密(MENC 格式),start.js 保持明文(Node 入口)
//  运行时由 start.js 注入的 Module._extensions['.js'] hook 自动解密
// ═══════════════════════════════════════════════

def nodejsSrcDir = file("src/main/nodejs-project-src")
def nodejsOutDir = file("${buildDir}/generated/assets/nodejs-project")

// 需要加密的重要文件(相对路径,POSIX 风格)
// 不加密: start.js(Node 入口必须明文)、package.json(Node 读取 JSON 不走 _compile)、
//         qishui-auth-v6/react.js|react-dom.js(开源库)、*.html(HTML 资源)、
//         build/**(二进制资源)、node_modules/**(第三方代码)
def NODEJS_ENCRYPT_FILES = [
    'server.js',
    'qishui-api.js',
    'qishui-auth-v6.js',
    'qishui-qr-login.js',
    'qq-vip-api.js',
    'kugou-api.js',
    'spotify-api.js',
    'dj-analyzer.js',
    'cuefield/adapter-mineradio.js',
    'cuefield/cue-profile.js',
    'cuefield/feedback-log.js',
    'cuefield/lrc-anchors.js',
    'cuefield/mineradio-bridge.js',
    'cuefield/recipe-planner.js',
    'cuefield/section-candidates.js',
    'cuefield/transition-evaluator.js',
    'qishui-audio-decryptor/decrypt-utils.js',
    'qishui-audio-decryptor/mp4-box.js',
    'qishui-audio-decryptor/track-decryptor.js',
    'qishui-auth-v6/bdms.js',
    'qishui-auth-v6/sdk-glue.js'
] as Set

task prepareNodejsProject {
    description = 'Copies nodejs-project-src to build/generated/assets/nodejs-project, encrypting important files (MENC format)'
    group = 'build'
    inputs.dir nodejsSrcDir
    outputs.dir nodejsOutDir

    doLast {
        if (!nodejsSrcDir.exists()) {
            logger.warn("prepareNodejsProject: src/main/nodejs-project-src not found, skipping")
            return
        }

        // 清理旧输出(处理源文件删除/改名的情况)
        if (nodejsOutDir.exists()) {
            nodejsOutDir.deleteDir()
        }
        nodejsOutDir.mkdirs()

        // 复用 encryptMineradioAssets 的密钥派生(passphrase 一致,start.js 用同一密钥解密)
        def keyBytes = MessageDigest.getInstance('SHA-256').digest(MINERADIO_KEY_PASSPHRASE_BYTES)
        def random = new SecureRandom()
        def magic = [77, 69, 78, 67] as byte[]  // "MENC"

        def srcBase = nodejsSrcDir.canonicalPath
        int encCount = 0
        int copyCount = 0

        nodejsSrcDir.eachFileRecurse { srcFile ->
            if (!srcFile.isFile()) return

            def relPath = srcFile.canonicalPath.substring(srcBase.length() + 1)
            relPath = relPath.replace('\\', '/')
            def outFile = new File(nodejsOutDir, relPath)
            outFile.parentFile.mkdirs()

            if (NODEJS_ENCRYPT_FILES.contains(relPath)) {
                // 加密: MENC(4) + IV(16) + AES/CBC/PKCS5 密文
                def plainBytes = srcFile.bytes
                def iv = new byte[16]
                random.nextBytes(iv)
                def cipher = Cipher.getInstance('AES/CBC/PKCS5Padding')
                cipher.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(keyBytes, 'AES'), new IvParameterSpec(iv))
                def encBytes = cipher.doFinal(plainBytes)
                outFile.withOutputStream { out ->
                    out.write(magic)
                    out.write(iv)
                    out.write(encBytes)
                }
                encCount++
            } else {
                // 直接复制(包括 start.js, node_modules/**, package.json, react*.js, *.html, build/**)
                outFile.bytes = srcFile.bytes
                copyCount++
            }
        }

        logger.lifecycle("prepareNodejsProject: ${encCount} encrypted, ${copyCount} copied → ${nodejsOutDir}")
    }
}

// 确保构建前完成 nodejs-project 准备
tasks.getByPath(':app:preBuild').dependsOn('prepareNodejsProject')
