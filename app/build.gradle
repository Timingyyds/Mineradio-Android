android {
  namespace 'com.mineradio.app'
  compileSdk = 37

  def props = new Properties()
  file("$rootDir/gradle.properties").withInputStream { props.load(it) }
  def MAJOR_VERSION = Integer.parseInt(props["MAJOR_VERSION"])
  def MINOR_VERSION = Integer.parseInt(props["MINOR_VERSION"])
  def BUILD_VERSION = Integer.parseInt(props["BUILD_VERSION"])
  def PATCH_VERSION = Integer.parseInt(props["PATCH_VERSION"])
  // ★ versionCode 加入 3_000_000 基数，避免从旧 3.0.0 降级安装被系统拦截
  // versionName 为 MAJOR.MINOR.BUILD.PATCH（如 1.1.6.1）
  rootProject.ext.buildVersionCode =
      3_000_000 + (MAJOR_VERSION) * 1_000_000 + (MINOR_VERSION) * 100_000 + BUILD_VERSION * 1000 + PATCH_VERSION
  rootProject.ext.buildVersionName = "$MAJOR_VERSION.$MINOR_VERSION.$BUILD_VERSION.$PATCH_VERSION"

  println("buildVersionCode = ${rootProject.ext.buildVersionCode}")
  println("buildVersionName= ${rootProject.ext.buildVersionName}")

  defaultConfig {
        applicationId "com.mineradio.app"
        minSdk 26
        targetSdk 35
    versionCode buildVersionCode
    versionName buildVersionName

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables {
      useSupportLibrary true
    }
    ndk {
      //armeabi armeabi-v7a arm64-v8a x86 x86_64
      abiFilters 'arm64-v8a'
    }
    externalNativeBuild {
      cmake {
        // ★ 使用 c++_shared 共享 STL，打包 libc++_shared.so
        //   libnode.so 依赖 libc++_shared.so，缺少此参数会导致 dlopen 失败（UnsatisfiedLinkError）
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-std=c++17 -fexceptions -frtti"
      }
    }
  }

  signingConfigs {
    signingConfig {
      storeFile rootProject.file("key.jks")
      storePassword 'SPICa27'
      keyAlias 'wuqi'
      keyPassword 'SPICa27'
    }
  }

  lint {
    checkReleaseBuilds false
    abortOnError false
  }

  buildTypes {
    release {
      // ★ 按用户偏好：不启用全代码混淆(不做 minify/shrink)，仅加密 assets/nodejs-project 重要文件
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.signingConfig
    }
    debug {
      minifyEnabled false
      signingConfig signingConfigs.signingConfig
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
  buildFeatures {
    compose true
    buildConfig = true
  }
  // ★ Native 构建：编译 libmr_decrypt.so（RSA 私钥保护）
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ['libs']
      // ★ 将构建时生成的加密 assets 目录加入源集
      assets.srcDirs += file("${buildDir}/generated/assets")
    }
  }
  //  kapt {
  //    correctErrorTypes = true
  //  }
  packaging {
    resources {
      it.excludes += ["/META-INF/{AL2.0,LGPL2.1}", "META-INF/androidx*", "META-INF/androidx/**"]
    }
    jniLibs {
      useLegacyPackaging true
    }
  }
}

