apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    // namespace 保持原 Java 包名不变(代码里的 package 声明、硬编码组件名都依赖它);
    // 只改 applicationId —— 这是系统识别/桌面显示/安装升级用的「包名」。
    namespace = "com.mineradio.android"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = "37.0.0"
    defaultConfig {
        applicationId "Mineradio.timing"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 正式版本号：2.2.2（与站点 mineradio-version.json 保持一致）
        // versionCode 继续递增，保证老安装能覆盖升级。
        versionCode 20204
        versionName "2.2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // MPKG 壁纸的 libscenejni.so 只有 arm64 版
            abiFilters 'arm64-v8a'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    // ── 固定发布签名（DSH）────────────────────────────────────────────
    // 签名一致的 APK 才能覆盖安装保留数据。查找顺序：
    //   1. 环境变量 DSH_KEYSTORE 指定的路径
    //   2. 源码根目录 .keys/dsh-release.keystore（把密钥丢进去即可，无需改配置）
    //   3. android/app/dsh-release.keystore
    // 都找不到才回退旧 folia-debug 密钥（仅本地临时调试用，勿用其发布）。
    // 密码/别名可用 DSH_STOREPASS / DSH_KEYALIAS / DSH_KEYPASS 覆盖。
    def dshKeystoreFile = null
    def dshEnvPath = System.getenv('DSH_KEYSTORE')
    if (dshEnvPath != null && file(dshEnvPath).exists()) {
        dshKeystoreFile = file(dshEnvPath)
    } else {
        def candidates = [
                new File(rootProject.projectDir, '../.keys/dsh-release.keystore'),
                new File(projectDir, 'dsh-release.keystore'),
                new File(projectDir, 'folia-debug.keystore')
        ]
        dshKeystoreFile = candidates.find { it.exists() }
    }
    if (dshKeystoreFile == null) {
        logger.warn("DSH 签名密钥未找到（.keys/dsh-release.keystore），APK 将无法与已装版本覆盖安装")
    } else {
        logger.lifecycle("签名密钥: " + dshKeystoreFile.absolutePath)
    }
    signingConfigs {
        dsh {
            storeFile dshKeystoreFile ?: file('folia-debug.keystore')
            storePassword System.getenv('DSH_STOREPASS') ?: (dshKeystoreFile != null ? 'dsh2026pass' : 'folia2026')
            keyAlias System.getenv('DSH_KEYALIAS') ?: (dshKeystoreFile != null ? 'dshkey' : 'folia-debug')
            keyPassword System.getenv('DSH_KEYPASS') ?: (dshKeystoreFile != null ? 'dsh2026pass' : 'folia2026')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.dsh
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.dsh
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // MPKG 壁纸模块（LWService/ExoPlayer 视频引擎/WorkManager 保活）
    implementation "androidx.media3:media3-exoplayer:1.10.0"
    implementation "androidx.media3:media3-datasource:1.10.0"
    implementation "androidx.media3:media3-common:1.10.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.9.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
